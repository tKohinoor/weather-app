
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="weather-app">
        <h1>Weather App</h1>
        <p>Discover the weather in any city.</p>

        <form id="weather-form">
            <input
                type="text"
                id="city-input"
                placeholder="Enter a city, e.g. Mathura"
                required
            >
            <button type="submit">Search</button>
        </form>

        <p id="message">Search for a city to get started.</p>

        <section id="weather-result">
            <h2 id="city-name">City Name</h2>
            <p id="temperature">-- °C</p>
            <p id="condition">Weather condition</p>
            <p id="humidity">Humidity: --%</p>
            <p id="wind">Wind speed: -- km/h</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
